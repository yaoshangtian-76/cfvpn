name: 从 cfnew 同步 Releases（锁定完整版 v3.1）

# 修复说明：
# 原工作流使用 /releases/latest，2026-10-18 起上游 latest 变成「精简内核版」(37,806 字节)，
# 该版本不含面板页面、不含订阅生成，导致 Pages 站点后台打不开、客户端订阅里的节点全部 -1。
# 本版本把上游锁死在完整版 tag（v3.1，_worker.js 约 455,568 字节，含 HTML 面板与订阅生成），
# 并加了体积/内容校验，防止再被精简内核覆盖。

on:
  workflow_dispatch:        # 仅手动触发，不再每 6 小时自动覆盖
  # schedule:
  #   - cron: '0 */6 * * *'  # 需要定时同步时再放开，但上游已锁死，同步结果不会变化

env:
  UPSTREAM_TAG: v3.1
  UPSTREAM_REPO: byJoey/cfnew

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载指定 tag 的 Pages.zip
        run: |
          set -e
          URL="https://github.com/${UPSTREAM_REPO}/releases/download/${UPSTREAM_TAG}/Pages.zip"
          echo "下载: $URL"
          curl -fsSL -o Pages.zip "$URL"
          unzip -o Pages.zip -d .
          rm -f Pages.zip

      - name: 完整性校验（防止被精简内核覆盖）
        run: |
          set -e
          SIZE=$(stat -c%s _worker.js)
          echo "_worker.js 体积: $SIZE 字节"
          if [ "$SIZE" -lt 300000 ]; then
            echo "::error::_worker.js 只有 $SIZE 字节，属于精简内核（无面板/无订阅），中止提交"
            exit 1
          fi
          if ! grep -q 'doctype html' -i _worker.js; then
            echo "::error::_worker.js 中未发现面板 HTML，中止提交"
            exit 1
          fi
          if ! grep -q 'clash' -i _worker.js; then
            echo "::error::_worker.js 中未发现订阅生成逻辑，中止提交"
            exit 1
          fi
          echo "校验通过：完整版内核"

      - name: 提交并推送
        run: |
          set -e
          echo "${{ env.UPSTREAM_TAG }}" > VERSION.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化，无需提交"
          else
            git commit -m "锁定完整版内核 ${{ env.UPSTREAM_TAG }}（修复面板与订阅缺失）"
            git push
          fi
